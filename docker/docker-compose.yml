services:
  portfolio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ohhhdan-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      SCORM_PACKAGES_PATH: /app/scorm-packages
      CMS_SECRET: ${CMS_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASSWORD_BCRYPT: ${ADMIN_PASSWORD_BCRYPT}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
