# Synology Container Manager / SSH: run from repo root:
#   docker compose -f docker/synology/docker-compose.yml up -d --build
#
# Requires docker/synology/.env (npm run generate-prod-env)

name: ohhhdan-portfolio

services:
  portfolio:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: ohhhdan-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - production.env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      SCORM_PACKAGES_PATH: /app/scorm-packages
    volumes:
      # Persist CMS edits (Profile, Experience, Portfolio JSON)
      - ./data:/app/data
      # Optional SCORM packages (read-only)
      - ./scorm-packages:/app/scorm-packages:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
